name: Weekly offer ladder
# Every Monday morning: re-rank the offer ladder in src/data/offers.json on the previous 7 days of
# /go/ clicks (scripts/rerank-offers.mjs), commit the new order and the week's report, then start
# the normal build so the new order goes live. New partners with "newUntil" stay at #3 until then.
on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only read the clicks and show the report; change nothing
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: offer-ladder
  cancel-in-progress: false
jobs:
  rerank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Re-rank on last week's clicks
        env:
          CLOUDFLARE_ACCOUNT_ID: 5aa99b5280868c09bf3092fff6d06125
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: node scripts/rerank-offers.mjs ${{ inputs.dry_run && '--dry-run' || '' }} >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the new order and report
        if: ${{ !inputs.dry_run }}
        id: commit
        run: |
          git config user.name "everytip-ladder"
          git config user.email "redfernp@users.noreply.github.com"
          git add src/data/offers.json docs/ladder-reports
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Weekly offer ladder re-rank $(date -u +%F)"
          git push
          echo "changed=$(git diff --quiet HEAD~1 -- src/data/offers.json && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - name: Rebuild the site with the new order
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run staging-preview.yml --ref main -f fresh=false
